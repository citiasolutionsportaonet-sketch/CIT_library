# PostgreSQL da CIT Library. Porta publicada apenas em loopback (127.0.0.1).
# O usuário "cit" é o dono do schema (migrações). O aplicativo usa o papel
# restrito "cit_app", criado/atualizado por `npm run db:deploy` (scripts/db-grants.ts).
services:
  db:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: cit_library
      POSTGRES_USER: cit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD no .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - cit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cit -d cit_library']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  cit_pgdata:
